# Executa todos os notebooks do tutorial e falha se aparecer um erro inesperado.
# Os erros feitos de propósito (células marcadas com ⚠️) não contam.
name: Verificação dos notebooks

on:
  push:
    branches: [main]
    paths:
      - "Introdução à Programação/tutorial_python/**"
      - ".github/workflows/notebooks.yml"
  pull_request:
    paths:
      - "Introdução à Programação/tutorial_python/**"
      - ".github/workflows/notebooks.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *" # dia 1 de cada mês: apanha alterações nas bibliotecas

permissions:
  contents: read

concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executar:
    name: ${{ matrix.pasta }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pasta: [nivel_1_introducao, nivel_2_avancado, nivel_3_ia]
    defaults:
      run:
        working-directory: "Introdução à Programação/tutorial_python"
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Introdução à Programação/tutorial_python/requirements.txt"

      - name: Instalar as bibliotecas
        run: python -m pip install -r requirements.txt

      - name: Instalar o PyTorch (CPU)
        if: matrix.pasta == 'nivel_3_ia'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Executar os notebooks
        run: python ferramentas/verificar_notebooks.py ${{ matrix.pasta }}
