# Executa todos os notebooks do tutorial de ciência de dados e falha se aparecer um erro inesperado.
name: Verificação dos notebooks (ciência de dados)

on:
  push:
    branches: [main]
    paths:
      - "Introdução à Ciência de Dados/tutorial_ciencia_dados/**"
      - ".github/workflows/notebooks_ciencia_dados.yml"
  pull_request:
    paths:
      - "Introdução à Ciência de Dados/tutorial_ciencia_dados/**"
      - ".github/workflows/notebooks_ciencia_dados.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 5 1 * *" # dia 1 de cada mês: apanha alterações nas bibliotecas

permissions:
  contents: read

concurrency:
  group: notebooks-ciencia-dados-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executar:
    name: Executar os notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "Introdução à Ciência de Dados/tutorial_ciencia_dados"
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Introdução à Ciência de Dados/tutorial_ciencia_dados/requirements.txt"

      - name: Instalar as bibliotecas
        run: python -m pip install -r requirements.txt

      - name: Executar os notebooks
        run: python ferramentas/verificar_notebooks.py
