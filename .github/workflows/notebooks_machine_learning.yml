# Executa todos os notebooks do tutorial de Machine Learning e falha se aparecer um erro inesperado.
name: Verificação dos notebooks (Machine Learning)

on:
  push:
    branches: [main]
    paths:
      - "Introdução à Aprendizagem Automática/tutorial_machine_learning/**"
      - ".github/workflows/notebooks_machine_learning.yml"
  pull_request:
    paths:
      - "Introdução à Aprendizagem Automática/tutorial_machine_learning/**"
      - ".github/workflows/notebooks_machine_learning.yml"
  workflow_dispatch:
  schedule:
    - cron: "52 5 1 * *" # dia 1 de cada mês: apanha alterações nas bibliotecas

permissions:
  contents: read

concurrency:
  group: notebooks-machine-learning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executar:
    name: Executar os notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "Introdução à Aprendizagem Automática/tutorial_machine_learning"
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Introdução à Aprendizagem Automática/tutorial_machine_learning/requirements.txt"

      - name: Instalar as bibliotecas
        run: python -m pip install -r requirements.txt

      - name: Executar os notebooks
        run: python ferramentas/verificar_notebooks.py
